# devices/frankel/device.conf: the Google Pixel 10 (frankel, Tensor G5 "lga"), bare metal: Google's boot loader starts the SoC's
# boot shim (socs/lga/shim), the shim starts xnuloader, the loader starts XNU. Nothing of this has run on a phone yet: every line
# below is `partial` (written, not seen) or `missing`. README.md has the hardware's facts and where each came from.

device frankel
	title       Pixel 10
	vendor      Google
	soc         lga
	defconfig   frankel_defconfig
	maintainer  Scion (README.md)
	status      display     partial   the boot loader's framebuffer (1080 x 2424) as the shim finds it (the DPU's layer, or scion.fb= on the boot image's command line), through the loader: written, not yet seen; the panel is a command-mode DSI panel, whether a write reaches it without a frame trigger is unknown; the kernel's frame kicker (lga_kick=HZ) starts a frame every period and reads the frame counter: written, run in QEMU against RAM only
	status      cpu         partial   core 0 alone (the first boot); all eight with bootcpu=7 cpus=8 core0=2 through the shim's PSCI (EL2 to EL1): seen in QEMU with -cpu max (PAC, BTI, MTE, SVE, SME on), not on the phone
	status      touch       missing   FocalTech on SPI (0x0DB33000), shared with the AOC; interrupt on an AOC pin
	status      buttons     missing
	status      storage     partial   Google's UFS host (0x3C400000) read only, the system image from `userdata` (system_apfs=ufs_userdata): seen to SpringBoard in QEMU on QEMU's UFS device (lga-qemu), not on a phone; whether ABL leaves the host up is unknown
	status      gpu         missing   PowerVR DXT-48-1536
	status      audio       missing
	status      battery     missing   MAX77779 fuel gauge
	status      wifi        missing
	status      bluetooth   missing
	status      cellular    missing
	status      thermal     missing
	status      usb         missing
